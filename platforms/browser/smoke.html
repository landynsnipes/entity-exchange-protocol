<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>EXP browser platform smoke</title></head>
<body data-exp-smoke="running">running
<script type="module">
  import { generateBrowserWalletKey, importRequesterPublicKey } from "/dist/platform-browser.bundle.js";
  try {
    const payload = new TextEncoder().encode("EXP browser runtime");
    const generated = await generateBrowserWalletKey("chrome-smoke-key");
    const signature = await generated.signer.sign(payload);
    const publicKey = await importRequesterPublicKey(generated.publicKeyRaw);
    const bytes = Uint8Array.from(atob(signature.replaceAll("-", "+").replaceAll("_", "/")), character => character.charCodeAt(0));
    const verified = await crypto.subtle.verify("Ed25519", publicKey, bytes, payload);
    document.body.dataset.expSmoke = verified ? "passed" : "failed";
    document.body.textContent = verified ? "passed" : "failed";
  } catch (error) {
    document.body.dataset.expSmoke = "failed";
    document.body.textContent = `failed: ${error instanceof Error ? error.message : "unknown"}`;
  }
</script>
</body>
</html>
